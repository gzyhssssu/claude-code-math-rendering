name: Bug or compatibility report
description: Report a reproducible failure without uploading private cache data.
body:
  - type: markdown
    attributes:
      value: Do not attach cache files, backup manifests, extracted vendor code, credentials, or conversation screenshots. Redact local usernames and paths.
  - type: input
    id: versions
    attributes:
      label: Mode, Windows, Node.js, Python (native mode), and Claude versions
      description: Say cache or native mode, and whether Claude came from the Windows Store. Do not upload native packages or backups.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result, and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Sanitized diagnostic or error
      description: Include only the relevant error; remove profile paths and personal information.
